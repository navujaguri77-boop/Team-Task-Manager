version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk_password
      POSTGRES_DB: flowdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: python main.py
    environment:
      DATABASE_URL: postgresql://flowdesk:flowdesk_password@db:5432/flowdesk
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      ENVIRONMENT: development
      PORT: 8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: flowdesk_network
